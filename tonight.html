<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La vidéo du soir</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0d10; --text: #f2f2ee; --muted: #8b9098; --line: #22262c; --accent: #ffcc00; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, system-ui, sans-serif; }
    main { max-width: 460px; margin: 0 auto; padding: 20px 16px 40px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
    video { width: 100%; border-radius: 10px; display: block; background: #000; }
    .btn { display: block; width: 100%; text-align: center; padding: 14px; margin-top: 10px; border-radius: 10px;
      font: 600 16px Inter, sans-serif; text-decoration: none; cursor: pointer; border: 1px solid var(--line);
      background: transparent; color: var(--text); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #111; }
    pre { white-space: pre-wrap; font: 14px/1.5 Inter, sans-serif; background: #14181d; border-radius: 10px;
      padding: 14px; margin: 16px 0 0; }
    .note { color: var(--muted); font-size: 12px; margin-top: 14px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>La vidéo <span>du soir</span></h1>
  <p class="sub" id="when">Chargement…</p>
  <video id="video" controls playsinline></video>
  <a id="download" class="btn primary" download>Télécharger la vidéo</a>
  <button id="copy" class="btn">Copier la légende</button>
  <pre id="caption"></pre>
  <p class="note" id="note"></p>
  <p class="note"><a href="../">Voir la carte en direct</a></p>
</main>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  try {
    const meta = await fetch('meta.json', { cache: 'no-store' }).then((r) => r.json());
    const caption = await fetch('caption.txt', { cache: 'no-store' }).then((r) => r.text());
    $('when').textContent = meta.dayName + (meta.voiced ? '' : ' · sans narration ce soir');
    $('video').src = meta.video;
    $('download').href = meta.video;
    $('download').download = meta.video;
    $('caption').textContent = caption.trim();
    $('copy').onclick = async () => {
      await navigator.clipboard.writeText(caption.trim());
      $('copy').textContent = 'Copié ✓';
    };
    $('note').textContent = 'Faite le ' + new Date(meta.made).toLocaleString('fr-CA') + '. Une nouvelle vidéo arrive vers 20 h 30, heure de Montréal.';
  } catch {
    $('when').textContent = "La vidéo de ce soir n'est pas encore prête — revenez après 20 h 30, heure de Montréal.";
  }
})();
</script>
</body>
</html>
